apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: tiltakspenger-tiltak
  namespace: tpts
  labels:
    team: tpts
spec:
  image: {{ image }}
  port: 8080
  ingresses:
    - https://tiltakspenger-tiltak.intern.nav.no
  azure:
    application:
      enabled: true
      claims:
        extra:
          - "NAVident"
  # Prober følger felles mal, se «Delte konvensjoner» i navikt/tiltakspenger AGENTS.md. Avvik skal begrunnes med kommentar her.
  startup:
    path: /isalive
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 60
    timeout: 3
  liveness:
    path: /isalive
    periodSeconds: 10
    failureThreshold: 3
    timeout: 3
  readiness:
    path: /isready
    periodSeconds: 5
    failureThreshold: 1
    timeout: 3
  prometheus:
    enabled: true
    path: /metrics
  replicas:
    min: 2
    max: 2
  resources:
    limits:
      memory: 2000Mi
    requests:
      memory: 1000Mi
  tokenx:
    enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: tiltakspenger-soknad-api
        - application: tiltakspenger-saksbehandling-api
    outbound:
      rules:
        - application: tiltakshistorikk
          namespace: team-mulighetsrommet
        - application: logging
          namespace: nais-system
      external:
        - host: pdl-api.prod-fss-pub.nais.io
  env:
    - name: TILTAKSHISTORIKK_SCOPE
      value: api://prod-gcp.team-mulighetsrommet.tiltakshistorikk/.default
    - name: PDL_URL
      value: https://pdl-api.prod-fss-pub.nais.io
    - name: PDL_SCOPE
      value: api://prod-fss.pdl.pdl-api/.default
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
